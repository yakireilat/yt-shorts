# Shorts Machine configuration

[channel]
series_name = "The Hidden Why"
niche = "how the world really works: the hidden engineering, economics, geography, biology and history behind ordinary things"
# Rotating pillars keep one recognizable format with endless topics; the analytics loop shifts weight toward winners.
pillars = [
  "Everyday engineering (why objects and infrastructure are designed the way they are)",
  "Money mechanics (why things cost what they cost, how markets and businesses really work)",
  "Maps & geography (why cities, borders, routes and resources are where they are)",
  "The body & living things (the surprising mechanics of biology)",
  "History's hidden details (small decisions that shaped today)",
  "Space & physics (everyday physics and the cosmos, intuitively)",
]
audience = "curious adults 18-45 who like smart, fast explainers"
tone = "confident, warm, precise, a little witty; never hype, never clickbait lies"
language = "en-us"
handle_cta = ""                 # e.g. "@thehiddenwhy" shown on outro; empty = none

[claude]
binary = "claude"
model = ""                       # empty = CLI default; e.g. "sonnet" or "opus"
research = true                  # allow WebSearch/WebFetch during ideation
fact_check = true                # second pass to verify claims
timeout_sec = 600
retries = 3

[voice]
model = "models/kokoro-v1.0.onnx"
voices = "models/voices-v1.0.bin"
voice = "am_michael"             # try: af_heart, am_michael, bm_george, af_bella, am_fenrir
speed = 1.08
scene_gap_sec = 0.18

[video]
width = 1080
height = 1920
fps = 30
crf = 18
workers = 4                      # parallel Chromium pages for rendering
min_sec = 20
max_sec = 58
theme = "auto"                   # auto | midnight | ember | mint | paper | ultraviolet

[images]
enabled = true
max_per_video = 3                # scenes that may use a real photo
licenses = "cc0,pdm,by"          # commercial-safe; add "by-sa" if you accept share-alike
min_width = 1000
vision_check = true              # Claude looks at candidates and picks / rejects (uses Read tool on thumbnails)

[quality]
narration_check = true           # faster-whisper transcribes the voice and compares it to the script
whisper_model = "small.en"       # tiny.en / base.en are faster, small.en is more accurate (~6 s per short on CPU)
max_wer_warn = 0.06
max_wer_fail = 0.15
claude_review = true             # Claude scores frame 0 + every scene (hook, readability, design, match)
min_review_score = 6.0           # below this the short is never published
auto_fix_retries = 1             # on FAIL (or review "fix" below autofix_below): Claude revises + re-render once
autofix_below = 7.0              # the better of the two versions is kept in the publish queue

[audio]
music_dir = "assets/music"       # drop CC0 / licensed tracks here; empty dir = procedural bed
music_db = -21
sfx = true
target_lufs = -14

[publish]
enabled = false                  # set true after `python -m shorts auth`
privacy = "public"               # public | unlisted | private
max_uploads_per_day = 6          # default API quota allows ~6/day; raise after quota extension
category_id = "27"               # Education
synthetic_media = true
made_for_kids = false
client_secret = "secrets/client_secret.json"
token = "secrets/token.json"

[paths]
out = "out"
db = "data/shorts.db"
